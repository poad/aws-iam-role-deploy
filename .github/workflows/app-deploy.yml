name: Application Deploy

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Name of repository (with owner)'
        required: true
        type: string
        default: poad/
      path:
        description: 'Path of IAM Role AWS CDK in repository'
        required: true
        type: string
        default: deploy-role

env:
  OIDC_IAM_ROLE_ARN: ${{ secrets.OIDC_IAM_ROLE_ARN }}
  AWS_REGION: us-west-2

permissions:
  id-token: write
  contents: read

# 同時実行すると CREATE_IN_PROGRESS や UPDATE_IN_PROGRESS 状態で cdk deploy を行う可能性があるため抑止する
concurrency:
  group: "cloudformation"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Generate GitHub App Token
      id: generate_token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ vars.APP_CLIENT_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}

    - name: Get repository info
      id: repo_info
      env:
        GH_TOKEN: ${{ steps.generate_token.outputs.token }}
      run: |
        REPO_JSON=$(gh api "repos/${{ inputs.repository }}" --jq '{id: .id, owner_id: .owner.id}')
        REPO_ID=$(echo "$REPO_JSON" | jq -r '.id')
        OWNER_ID=$(echo "$REPO_JSON" | jq -r '.owner_id')

        echo "::add-mask::$REPO_ID"
        echo "::add-mask::$OWNER_ID"

        echo "repository_id=$REPO_ID" >> "$GITHUB_OUTPUT"
        echo "owner_id=$OWNER_ID" >> "$GITHUB_OUTPUT"

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        token: ${{ steps.generate_token.outputs.token }}
        repository: ${{ inputs.repository }}

    - name: Install pnpm
      uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
      with:
        role-to-assume: ${{ env.OIDC_IAM_ROLE_ARN }}
        role-session-name: GitHubActions
        aws-region: ${{ env.AWS_REGION }}

    - name: deploy
      working-directory: ${{ inputs.path }}
      env:
        REPOSITORY_ID: ${{ steps.repo_info.outputs.repository_id }}
        REPOSITORY_OWNER_ID: ${{ steps.repo_info.outputs.owner_id }}
      run: |
        pnpm dlx aws-cdk@latest deploy \
          -c "repository-id=$REPOSITORY_ID" \
          -c "repository-owner-id=$REPOSITORY_OWNER_ID" \
          --require-approval=never
